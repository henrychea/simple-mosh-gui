[package]
name = "simple-mosh-gui"
version = "0.1.0"
edition = "2024"
description = "Tiny GUI to start mosh-server (macOS and Android/Termux)"
license = "MIT"
repository = "https://github.com/henrychea/simple-mosh-gui"
readme = "README.md"

[lib]
# cdylib is required for Android, lib for desktop (see the egui hello_android example).
crate-type = ["cdylib", "lib"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[package.metadata.android]
package = "com.henrychea.simplemoshgui"
label = "Simple Mosh GUI"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35
